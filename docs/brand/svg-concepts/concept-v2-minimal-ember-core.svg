<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FORJA — V2: Mancuerna minimalista con centro brasa</title>
  <desc id="desc">Mancuerna geométrica con el segmento central de la barra en brasa, como el metal siendo forjado.</desc>
  <rect width="512" height="512" fill="#101316"/>
  <!-- barra: tramos fríos -->
  <rect x="40" y="240" width="160" height="32" rx="16" fill="#D7DEE4"/>
  <rect x="312" y="240" width="160" height="32" rx="16" fill="#D7DEE4"/>
  <!-- barra: centro brasa -->
  <rect x="200" y="240" width="112" height="32" rx="16" fill="#C77B45"/>
  <!-- discos -->
  <rect x="40" y="196" width="56" height="120" rx="16" fill="#A0B0BC"/>
  <rect x="416" y="196" width="56" height="120" rx="16" fill="#A0B0BC"/>
</svg>
