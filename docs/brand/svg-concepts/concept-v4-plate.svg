<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FORJA — V4: Placa con anillo brasa</title>
  <desc id="desc">Disco de pesas visto de frente con agujero central y un anillo de brasa en el interior.</desc>
  <rect width="512" height="512" fill="#101316"/>
  <!-- placa de acero -->
  <circle cx="256" cy="256" r="176" fill="#D7DEE4"/>
  <!-- agujero central -->
  <circle cx="256" cy="256" r="64" fill="#101316"/>
  <!-- anillo brasa interior -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="#C77B45" stroke-width="26"/>
</svg>
