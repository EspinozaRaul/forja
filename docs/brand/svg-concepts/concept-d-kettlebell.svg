<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FORJA — Concepto D: Kettlebell brasa</title>
  <desc id="desc">Kettlebell de acero con el cuerpo al rojo vivo desde dentro, como metal listo para forjar.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7DEE4"/>
      <stop offset="1" stop-color="#A0B0BC"/>
    </linearGradient>
    <radialGradient id="emberBody" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#FFB86B"/>
      <stop offset="0.5" stop-color="#C77B45"/>
      <stop offset="1" stop-color="#8E4A26" stop-opacity="0.15"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B45" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C77B45" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#101316"/>
  <circle cx="256" cy="270" r="140" fill="url(#bgGlow)"/>
  <!-- Asa de acero -->
  <path d="M 182,168 C 182,88 330,88 330,168" fill="none" stroke="url(#steel)" stroke-width="24" stroke-linecap="round"/>
  <!-- Cuerpo de acero -->
  <path d="M 130,270 a 126,126 0 0 1 252,0 l 0,46 a 28,28 0 0 1 -28,28 l -196,0 a 28,28 0 0 1 -28,-28 z" fill="url(#steel)" stroke="#E9EDF0" stroke-opacity="0.3" stroke-width="2"/>
  <!-- Brasa interior -->
  <path d="M 168,270 a 88,88 0 0 1 176,0 l 0,26 a 24,24 0 0 1 -24,24 l -128,0 a 24,24 0 0 1 -24,-24 z" fill="url(#emberBody)"/>
</svg>
